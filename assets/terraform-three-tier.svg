" stroke="#1b2633" stroke-width="1"/><path d="M0 120H800" stroke="#1b2633" stroke-width="1"/><path d="M0 160H800" stroke="#1b2633" stroke-width="1"/><path d="M0 200H800" stroke="#1b2633" stroke-width="1"/><path d="M0 240H800" stroke="#1b2633" stroke-width="1"/><path d="M0 280H800" stroke="#1b2633" stroke-width="1"/><path d="M0 320H800" stroke="#1b2633" stroke-width="1"/><path d="M0 360H800" stroke="#1b2633" stroke-width="1"/><path d="M0 400H800" stroke="#1b2633" stroke-width="1"/><path d="M0 440H800" stroke="#1b2633" stroke-width="1"/><text x="28" y="40" fill="#63d2ff" font-size="12" letter-spacing="2">THREE-TIER AWS STACK: COMPOSED FROM TERRAFORM MODULES</text><line x1="150" y1="220.0" x2="210" y2="150.0" stroke="#63d2ff" stroke-width="1.5" marker-end="url(#ah-line)"/><text x="180.0" y="179.0" text-anchor="middle" fill="#8a9bad" font-size="10">HTTP</text><line x1="285.0" y1="180" x2="285.0" y2="260" stroke="#63d2ff" stroke-width="1.5" marker-end="url(#ah-line)"/><line x1="285.0" y1="260" x2="500.0" y2="180" stroke="#63d2ff" stroke-width="1.5" marker-end="url(#ah-line)"/><line x1="580" y1="150.0" x2="630" y2="220.0" stroke="#63d2ff" stroke-width="1.5" marker-end="url(#ah-line)"/><text x="605.0" y="179.0" text-anchor="middle" fill="#8a9bad" font-size="10">SQL</text><line x1="500.0" y1="260" x2="500.0" y2="180" stroke="#ff7a45" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah-warm)"/><rect x="40" y="190" width="110" height="60" rx="4" fill="#111820" stroke="#63d2ff" stroke-width="1.4"/><text x="95.0" y="216.0" text-anchor="middle" fill="#e8eef4" font-size="13" font-weight="600">Internet</text><text x="95.0" y="233.0" text-anchor="middle" fill="#8a9bad" font-size="10.5">users</text><rect x="210" y="120" width="150" height="60" rx="4" fill="#111820" stroke="#63d2ff" stroke-width="1.4"/><text x="285.0" y="146.0" text-anchor="middle" fill="#e8eef4" font-size="13" font-weight="600">ALB (AZ-a, AZ-b)</text><text x="285.0" y="163.0" text-anchor="middle" fill="#8a9bad" font-size="10.5">module: alb</text><rect x="210" y="260" width="150" height="60" rx="4" fill="#111820" stroke="#63d2ff" stroke-width="1.4"/><text x="285.0" y="286.0" text-anchor="middle" fill="#e8eef4" font-size="13" font-weight="600">Target group</text><text x="285.0" y="303.0" text-anchor="middle" fill="#8a9bad" font-size="10.5">health checks</text><rect x="420" y="120" width="160" height="60" rx="4" fill="#111820" stroke="#63d2ff" stroke-width="1.4"/><text x="500.0" y="146.0" text-anchor="middle" fill="#e8eef4" font-size="13" font-weight="600">EC2 ASG</text><text x="500.0" y="163.0" text-anchor="middle" fill="#8a9bad" font-size="10.5">module: compute / user_data</text><rect x="420" y="260" width="160" height="60" rx="4" fill="#111820" stroke="#ff7a45" stroke-width="1.4"/><text x="500.0" y="286.0" text-anchor="middle" fill="#e8eef4" font-size="13" font-weight="600">Security groups</text><text x="500.0" y="303.0" text-anchor="middle" fill="#8a9bad" font-size="10.5">alb -> app -> db</text><rect x="630" y="190" width="130" height="60" rx="4" fill="#111820" stroke="#00e58a" stroke-width="1.4"/><text x="695.0" y="216.0" text-anchor="middle" fill="#e8eef4" font-size="13" font-weight="600">RDS</text><text x="695.0" y="233.0" text-anchor="middle" fill="#8a9bad" font-size="10.5">module: rds, multi-AZ</text><rect x="210" y="360" width="370" height="40" rx="4" fill="#111820" stroke="#63d2ff" stroke-width="1.4"/><text x="395.0" y="385.0" text-anchor="middle" fill="#e8eef4" font-size="13" font-weight="600">module: network (VPC, public/private subnets, routes)</text><text x="28" y="430" fill="#8a9bad" font-size="11">Each module is reusable per environment; state and variables stay separate.</text></svg>